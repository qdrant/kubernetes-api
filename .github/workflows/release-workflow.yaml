name: Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  Release:
    environment: release
    name: Release Workflow
    runs-on: ubuntu-latest
    permissions:
      # write permission is required to create a github release
      contents: write
      pull-requests: write
      id-token: write  # needed for cosign keyless signing with OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main=$(git rev-parse --verify "origin/main^{commit}")
          picked_from_main() {
            local commit=$1 merges parent source tree want
            merges=$(git rev-list --no-walk --count --min-parents=2 "$commit") || return 1
            [ "$merges" = 0 ] || return 1
            parent=$(git rev-parse --verify --quiet "$commit^") || return 1
            source=$(git log -1 --format=%B "$commit" | sed -n 's/^(cherry picked from commit \([0-9a-f]\{40\}\))$/\1/p' | tail -n 1) || return 1
            [ -n "$source" ] || return 1
            git merge-base --is-ancestor "$source" "$main" || return 1
            tree=$(git --attr-source="$parent" merge-tree --write-tree --no-messages --merge-base="$source^" "$parent" "$source") || return 1
            want=$(git rev-parse --verify "$commit^{tree}") || return 1
            [ "$tree" = "$want" ]
          }
          on_main=0
          git merge-base --is-ancestor HEAD "$main" || on_main=$?
          if [ "$on_main" != 0 ]; then
            [ "$on_main" = 1 ]
            commits=$(git rev-list "$main..HEAD")
            [ -n "$commits" ]
            rejected=""
            for commit in $commits; do
              picked_from_main "$commit" || rejected="$rejected $(git rev-parse --short "$commit")"
            done
            if [ -n "$rejected" ]; then
              echo "::error::$(git rev-parse --short HEAD) has commits that are not on main:$rejected. Releases are cut from main, hotfixes use git cherry-pick -x of commits already on main, without changes"
              exit 1
            fi
          fi

      - name: Extract build info
        id: extract_build_info
        run: |
          echo "tag=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
          echo "commit_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to registry.cloud.qdrant.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.cloud.qdrant.io
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Package helm chart (CRDs)
        run: |
          # Ensure correct versions in Chart.yaml
          helm package --app-version ${{ steps.extract_build_info.outputs.tag }} --version ${{ steps.extract_build_info.outputs.tag }} charts/qdrant-kubernetes-api/

      - name: Publish Release Notes
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          commitish: ${{ github.ref }}
          tag: ${{ steps.extract_build_info.outputs.tag }}
          name: ${{ steps.extract_build_info.outputs.tag }}
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push helm (CRDs) chart to registry.cloud.qdrant.io
        id: push-helm-chart-crds
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_TOKEN: ${{ secrets.HARBOR_TOKEN }}
        run: |
          helm registry login registry.cloud.qdrant.io -u "${HARBOR_USERNAME}" --password "${HARBOR_TOKEN}"
          push_output=$(helm push qdrant-kubernetes-api-${{ steps.extract_build_info.outputs.tag }}.tgz oci://registry.cloud.qdrant.io/qdrant-charts 2>&1)
          echo $push_output
          digest=$(echo $push_output | grep -oP '(?<=Digest: ).*')
          echo $digest
          echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Push helm (CRDs) chart to registry.cloud.qdrant.io to public repo
        id: push-helm-chart-crds-public
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_TOKEN: ${{ secrets.HARBOR_TOKEN }}
        run: |
          helm registry login registry.cloud.qdrant.io -u "${HARBOR_USERNAME}" --password "${HARBOR_TOKEN}"
          push_output=$(helm push qdrant-kubernetes-api-${{ steps.extract_build_info.outputs.tag }}.tgz oci://registry.cloud.qdrant.io/library 2>&1)
          echo $push_output
          public_digest=$(echo $push_output | grep -oP '(?<=Digest: ).*')
          echo $public_digest
          echo "public_digest=${public_digest}" >> $GITHUB_OUTPUT

      - name: Sign helm chart (CRDs) at registry.cloud.qdrant.io
        run: |
          cosign sign --new-bundle-format=false --use-signing-config=false --yes "${TAGS}@${DIGEST}"
        env:
          TAGS: registry.cloud.qdrant.io/qdrant-charts/qdrant-kubernetes-api:${{ steps.extract_build_info.outputs.tag }}
          DIGEST: ${{ steps.push-helm-chart-crds.outputs.digest }}

      - name: Sign helm chart (CRDs) at registry.cloud.qdrant.io in public repo
        run: |
          cosign sign --new-bundle-format=false --use-signing-config=false --yes "${TAGS}@${DIGEST}"
        env:
          TAGS: registry.cloud.qdrant.io/library/qdrant-kubernetes-api:${{ steps.extract_build_info.outputs.tag }}
          DIGEST: ${{ steps.push-helm-chart-crds-public.outputs.public_digest }}